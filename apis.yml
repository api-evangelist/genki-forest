aid: genki-forest
name: Genki Forest
description: >-
  Genki Forest (元气森林), which trades internationally as Chi Forest, is a Chinese beverage company
  founded in Beijing in 2016 by Tang Binsen. It makes sugar-free sparkling water, brewed and iced
  teas, milk tea, and electrolyte and vitamin drinks under the 元气森林, 外星人 (Alienergy), 好自在 and
  Chi Forest brands, produced in its own plants in Chuzhou, Tianjin, Zhaoqing, Dujiangyan, Xianning,
  Taicang and Jiangsu. Its products are distributed across more than 30 Chinese provinces, cities and
  autonomous regions and exported to more than 40 countries. It is not a software vendor and runs no
  public developer program; its only public machine-readable API surface is a partner-facing open
  platform at open.yuanqisenlin.com that serves a Swagger 2.0 document for a distributor and
  receivables management service, and a first-party llms.txt published for AI crawlers on its
  corporate site.
