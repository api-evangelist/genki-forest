apis:
- name: Genki Forest Open Platform — Distributor & Receivables Management
  description: >-
    Partner-facing API gateway at open.yuanqisenlin.com serving a Swagger 2.0 document titled
    "经销商&账款管理" (Distributor & Receivables Management, service name "arthur-merchant"). The
    document is publicly reachable at /v2/api-docs and rendered by a public knife4j UI at /doc.html,
    but it declares ZERO operations — only the two header credentials the gateway requires
    (Authorization bearer token and a tenantNumber tenant header). The operation catalog is not
    published publicly. Contact addresses in the document are @yuanqisenlin.com, and the declared
    host is open.yuanqisenlin.com, so the contract is unambiguously Genki Forest's own.
  humanURL: https://open.yuanqisenlin.com/doc.html
